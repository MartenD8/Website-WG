# Nginx – HTTP + HTTPS for Event Calendar
# Domain: alleshateinendenurdiewghat24.de
#
# Install:
#   sudo cp deploy/nginx-alleshateinendenurdiewghat24.de.conf /etc/nginx/sites-available/alleshateinendenurdiewghat24.de
#   sudo ln -sf /etc/nginx/sites-available/alleshateinendenurdiewghat24.de /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (einmalig):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d alleshateinendenurdiewghat24.de -d www.alleshateinendenurdiewghat24.de

upstream event_calendar_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name alleshateinendenurdiewghat24.de www.alleshateinendenurdiewghat24.de;

    # Nach Certbot: HTTP → HTTPS (Certbot setzt das oft automatisch)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://event_calendar_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    client_max_body_size 8M;
}

